services:
  - type: web
    name: nub-cal-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci && npm run build --workspace @ai-fitness/api
    startCommand: npm run start --workspace @ai-fitness/api
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: AI_REQUEST_TIMEOUT_MS
        value: 60000
